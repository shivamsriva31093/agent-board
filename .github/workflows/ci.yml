name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # transformers.js downloads all-MiniLM-L6-v2 on first use; cache it between runs
      - uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-models-all-MiniLM-L6-v2
      # generous timeout so the cold model download doesn't fail the embedding tests
      - run: pnpm vitest run --testTimeout=60000
      - run: pnpm build

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
